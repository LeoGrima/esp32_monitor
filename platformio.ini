; Painel de mesa para o módulo ES3C28P (ESP32-S3 + IPS 2.8" 240x320 com toque capacitivo)

[platformio]
default_envs = es3c28p

[env:es3c28p]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Módulo com 16 MB de flash QSPI e 8 MB de PSRAM OPI
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Iinclude
    -Isrc

lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#1.3.0
    https://github.com/bblanchon/ArduinoJson.git#v7.4.2

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
